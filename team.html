<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Team members and alumni.">
  <meta name="theme-color" content="#f0f0ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15161a" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <div id="site-header"></div>

  <main id="main">
    <section class="page-head">
      <div class="wrap">
        <h1>Team members</h1>
        <p class="lede">Researchers working on diet, meal timing and glucose in pregnancy and beyond.</p>
      </div>
    </section>
    <section class="section">
      <div class="wrap"><div class="split">
        <header>
          <h2>Principal investigator</h2>
        </header>
        <div>
          <div data-render="pi"></div>
        </div>
      </div></div>
    </section>
    <section class="section">
      <div class="wrap"><div class="split">
        <header>
          <h2>Current members</h2>
        </header>
        <div>
          <ul class="member-grid" data-render="members"></ul>
        </div>
      </div></div>
    </section>
    <section class="section">
      <div class="wrap"><div class="split">
        <header>
          <h2>Alumni</h2>
        </header>
        <div>
          <ul class="plain-list alumni" data-render="alumni"></ul>
        </div>
      </div></div>
    </section>
    <section class="section" hidden>
      <div class="wrap"><div class="split">
        <header>
          <h2>Gallery</h2>
          <p>Select a photo to enlarge it.</p>
        </header>
        <div>
          <ul class="gallery" data-render="gallery"></ul>
        </div>
      </div></div>
    </section>

  </main>

  <div id="site-footer"></div>
